spring.application.name=order-service
server.port=8083

# Keycloak OAuth2 Configuration
spring.security.oauth2.client.registration.keycloak.client-id=order-service-confidential
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:your-client-secret-here}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:8083/login/oauth2/code/keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/minwei_keycloak}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Resource Server (for API authentication)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/minwei_keycloak}

# Apache ActiveMQ Artemis Configuration
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}
spring.artemis.pool.enabled=true
spring.artemis.pool.max-connections=10

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.org.springframework.jms=INFO
logging.level.org.apache.activemq=INFO
